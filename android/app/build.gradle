plugins {
    id 'com.android.application'
}

// The web version (../../web) is the app's UI. It is copied into the APK's assets as www/.
// It contains only the port's own code and freely licensed fonts, never game files.
abstract class CopyWebTask extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getSource()
    @OutputDirectory abstract DirectoryProperty getOutput()

    @TaskAction
    void run() {
        File src = source.get().asFile
        File dest = new File(output.get().asFile, 'www')
        project.delete(output.get().asFile)
        project.copy { spec ->
            spec.from(src)
            spec.into(dest)
        }
    }
}

def copyWeb = tasks.register('copyWeb', CopyWebTask) {
    source = rootProject.layout.projectDirectory.dir('../web')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(copyWeb) { it.output }
    }
}

android {
    namespace 'xyz.mariosjaque.slopslastcry'
    compileSdk 34

    defaultConfig {
        applicationId 'xyz.mariosjaque.slopslastcry'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The release key is never stored in the repository. CI writes it from the SIGNING_KEYSTORE_B64 and
    // SIGNING_PASSWORD secrets; locally, set SLC_KEYSTORE (path to release.p12) and SLC_KEYSTORE_PASSWORD.
    def ksPath = System.getenv('SLC_KEYSTORE')
    def ksPass = System.getenv('SLC_KEYSTORE_PASSWORD')
    signingConfigs {
        if (ksPath && ksPass) {
            release {
                storeFile file(ksPath)
                storeType 'pkcs12'
                storePassword ksPass
                keyAlias 'slc'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath && ksPass) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
