name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the web version
        run: cd web && zip -r ../slops-last-cry-web.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: slops-last-cry-web
          path: slops-last-cry-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write the signing key from secrets
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD secrets (see README) to build a signed APK."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build the APK
        env:
          SLC_KEYSTORE: ${{ runner.temp }}/release.p12
          SLC_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk slops-last-cry.apk
      - name: Check the APK
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner verify --verbose slops-last-cry.apk
          $BT/aapt2 dump badging slops-last-cry.apk | grep -E "package|sdkVersion|application-label"
          unzip -l slops-last-cry.apk | grep -E "assets/www/(index|setup).html"
      - uses: actions/upload-artifact@v4
        with:
          name: slops-last-cry-android
          path: slops-last-cry.apk

  vita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install VitaSDK
        run: |
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"
          export VITASDK=$HOME/vitasdk PATH=$HOME/vitasdk/bin:$PATH
          git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
          cd /tmp/vdpm && ./bootstrap-vitasdk.sh
          for p in zlib bzip2 libpng libjpeg-turbo libwebp freetype harfbuzz sdl2 sdl2_ttf sdl2_image opus; do
            vdpm "$p" || { echo "::warning::vdpm package $p not found"; vdpm -Ss "${p%%_*}" || true; }
          done
          git clone --depth 1 --branch v0.14.0 https://github.com/quickjs-ng/quickjs "$GITHUB_WORKSPACE/vita/quickjs"
      - name: Build the VPK
        run: |
          cmake -S vita -B vita/build -DCMAKE_BUILD_TYPE=Release
          cmake --build vita/build -j4
          cp vita/build/slops-last-cry.vpk slops-last-cry.vpk
      - uses: actions/upload-artifact@v4
        with:
          name: slops-last-cry-vita
          path: slops-last-cry.vpk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, vita]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            slops-last-cry-web.zip
            slops-last-cry.apk
            slops-last-cry.vpk
