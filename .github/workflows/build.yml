name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the web version
        run: cd web && zip -r ../slops-last-cry-web.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: slops-last-cry-web
          path: slops-last-cry-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk slops-last-cry.apk
      - uses: actions/upload-artifact@v4
        with:
          name: slops-last-cry-android
          path: slops-last-cry.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            slops-last-cry-web.zip
            slops-last-cry.apk
